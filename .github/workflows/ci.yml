name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  macos-execution-proof:
    name: Native macOS execution proof
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      CAPY_DB_KEY: ci-test-key-at-least-32-characters-long!!
      CAPY_VAULT_KEY: ci-vault-key-at-least-32-characters-long!!
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Record and check native platform
        run: |
          {
            sw_vers
            uname -srm
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-build-version
            go version
            go env GOOS GOARCH CGO_ENABLED
            printf 'Deployment target: %s\n' "$MACOSX_DEPLOYMENT_TARGET"
          } | tee "$RUNNER_TEMP/macos-proof-environment.txt"
          test "$(uname -m)" = arm64
          test "$(go env GOOS)/$(go env GOARCH)" = darwin/arm64
          case "$(sw_vers -productVersion)" in
            26.*) ;;
            *) echo 'Expected the supported macOS 26 major' >&2; exit 1 ;;
          esac

      - name: Run native execution integration target with race detection
        id: native_tests
        run: |
          make --silent test-integration-race INTEGRATION_TEST_FLAGS=-json \
            | tee "$RUNNER_TEMP/macos-proof-tests.jsonl"

      - name: Run native run-store suite with race detection
        id: native_store
        if: ${{ !cancelled() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        run: |
          go test -tags fts5,integration -race -json -count=1 -p 1 -timeout 20m ./internal/runstore \
            | tee "$RUNNER_TEMP/macos-store-tests.jsonl"

      - name: Run compiled native execution modes
        id: native_modes
        if: ${{ !cancelled() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        run: |
          go test -tags fts5 -race -json -count=1 -timeout 20m ./cmd/capy \
            -run '^Test(MCPOrdinaryCaptureOutcomes|CapturedPublicOwnerCwdAndRejections|MCPRunHandoffTransport|MCPExecuteFileCapturedLifetime|MCPSerialBatchCapture|MCPParallelBatchControls|DoctorRunStoreParity|DoctorRunInvalidConfigReportsCapability)$' \
            | tee "$RUNNER_TEMP/macos-mode-tests.jsonl"

      - name: Require native proof fixtures to execute
        if: ${{ !cancelled() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        run: |
          python3 - "$RUNNER_TEMP/macos-proof-tests.jsonl" "$RUNNER_TEMP/macos-store-tests.jsonl" "$RUNNER_TEMP/macos-mode-tests.jsonl" <<'PY'
          import json
          import sys

          required = {
              ("executor", "TestDarwinWaitForExit"),
              ("executor", "TestDarwinGroupReentry"),
              ("executor", "TestDarwinObservedInventory"),
              ("executor", "TestDarwinObservedExecution"),
              ("executor", "TestDarwinObservedCompilerPhases"),
              ("executor", "TestDarwinObservedCleanupFailures"),
              ("executor", "TestDarwinObservedWaitFailures"),
              ("executor", "TestDarwinConcurrentCancellation"),
              ("executor", "TestDarwinCleanupDoesNotResignalExitingMembers"),
              ("execution", "TestDarwinCapturedRecovery"),
              ("execution", "TestDarwinCapturedPersistenceFailures"),
              ("execution", "TestDarwinCapturedOwnerLoss"),
              ("execution", "TestDarwinCapturedPublicAdmission"),
              ("execution", "TestDarwinCapturedObservationFailure"),
              ("execution", "TestDarwinBatchStalledStartupPreservesSibling"),
              ("execution", "TestDarwinBatchShutdownJoinsFinalizer"),
              ("execution", "TestDarwinBatchFinalizationFailureQuarantinesPendingChildren"),
              ("capy", "TestMCPOrdinaryCaptureOutcomes"),
              ("capy", "TestCapturedPublicOwnerCwdAndRejections"),
              ("capy", "TestMCPRunHandoffTransport"),
              ("capy", "TestMCPExecuteFileCapturedLifetime"),
              ("capy", "TestMCPSerialBatchCapture"),
              ("capy", "TestMCPParallelBatchControls"),
              ("capy", "TestDoctorRunStoreParity"),
              ("capy", "TestDoctorRunInvalidConfigReportsCapability"),
              ("runstore", "TestRecoveryMetadataUsesRecoveryBudget"),
              ("runstore", "TestAdmissionAccountingPreservesCallerBudgets"),
              ("runstore", "TestRetentionWorkUsesOperationBudgets"),
              ("runstore", "TestCaptureRetentionKeepsWriteDeadline"),
              ("runstore", "TestMaintenanceBoundsAndBusyWAL"),
              ("runstore", "TestLargeAdmissionMakesProgressAcrossEvictionBatches"),
              ("runstore", "TestLargeEvictionPersistsAfterAppendRetryFails"),
              ("runstore", "TestLeaseRefsInheritancePreservesLocksAndPermanentFiles"),
              ("runstore", "TestLeaseRefsRetainLocksAcrossCloseAndAliases"),
              ("runstore", "TestLeaseRefsGateSharedAcrossOwnersAndOneTimeRelease"),
              ("execution", "TestLeaseExchangeLaunchAndPermanentFiles"),
              ("execution", "TestLeaseExchangeGateWaitDoesNotSpawn"),
              ("execution", "TestLeaseExchangeStoppedHelperRecoversOwner"),
              ("execution", "TestLeaseExchangeDelayedReapRetainsReservation"),
              ("execution", "TestLeaseExchangePartialStartNeverKillsHelper"),
              ("execution", "TestLeaseExchangeIdentityAloneAcceptsUnlockedAliases"),
              ("execution", "TestLeaseExchangeCancellationAfterReadyKeepsNextGate"),
              ("execution", "TestLeaseExchangeSignalFailureRetainsUntilReap"),
              ("execution", "TestLeaseExchangeUnverifiedWaitKeepsProtection"),
          }
          for case in ("independent", "swapped", "reflected", "replayed", "bad-marker", "wrong-step"):
              required.add(("execution", "TestLeaseExchangeRejectsFalseIdentity/" + case))
          passed = set()
          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as log:
                  for line in log:
                      event = json.loads(line)
                      if event.get("Action") == "pass" and "Test" in event:
                          passed.add((event["Package"].rsplit("/", 1)[-1], event["Test"]))
          missing = sorted(required - passed)
          if missing:
              raise SystemExit("Native proof fixtures missing, skipped or failed: " + repr(missing))
          print(f"Verified {len(required)} native proof fixtures executed and passed")
          PY

      - name: Repeat native recovery and retention regressions
        if: ${{ !cancelled() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        run: |
          go test -tags fts5,integration -race -json -count=5 -timeout 10m \
            -run '^(TestRecoveryMetadataUsesRecoveryBudget|TestAdmissionAccountingPreservesCallerBudgets|TestRetentionWorkUsesOperationBudgets|TestCaptureRetentionKeepsWriteDeadline|TestMaintenanceBoundsAndBusyWAL|TestLargeAdmissionMakesProgressAcrossEvictionBatches|TestLargeEvictionPersistsAfterAppendRetryFails)$' \
            ./internal/runstore | tee "$RUNNER_TEMP/macos-retention-tests.jsonl"

      - name: Vet native integration code
        if: ${{ !cancelled() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        run: go vet -tags fts5,integration ./internal/runstore ./internal/executor ./internal/execution ./internal/platform ./cmd/capy

      - name: Build native binary
        if: ${{ !cancelled() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        run: go build -tags fts5 -o "$RUNNER_TEMP/capy-macos-proof" ./cmd/capy/

      - name: Check native artifact capture and recovery
        if: ${{ !cancelled() && (steps.native_tests.outcome == 'success' || steps.native_tests.outcome == 'failure') }}
        run: bash .github/scripts/capture-smoke.sh "$RUNNER_TEMP/capy-macos-proof"

      - name: Preserve native proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-execution-proof-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-proof-environment.txt
            ${{ runner.temp }}/macos-proof-tests.jsonl
            ${{ runner.temp }}/macos-store-tests.jsonl
            ${{ runner.temp }}/macos-mode-tests.jsonl
            ${{ runner.temp }}/macos-retention-tests.jsonl
          retention-days: 14

  linux-execution-proof:
    name: Linux execution integration proof
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "1"
      CAPY_DB_KEY: ci-test-key-at-least-32-characters-long!!
      CAPY_VAULT_KEY: ci-vault-key-at-least-32-characters-long!!
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Record Linux platform and candidate
        run: |
          {
            uname -srm
            go version
            go env GOOS GOARCH CGO_ENABLED
            git rev-parse HEAD
          } | tee "$RUNNER_TEMP/linux-proof-environment.txt"

      # This immutable comparison records previously unselected integration
      # suites. Historical failures remain evidence; candidate failures block.
      - name: Record pre-feature integration baseline
        id: baseline
        continue-on-error: true
        run: |
          baseline=13204a9a68a3def965950e765ca910c615232913
          git worktree add --detach "$RUNNER_TEMP/capy-pre-macos" "$baseline"
          cd "$RUNNER_TEMP/capy-pre-macos"
          git rev-parse HEAD > "$RUNNER_TEMP/linux-baseline-revision.txt"
          go test -tags fts5,integration -race -json -count=1 -p 1 -timeout 20m \
            ./internal/executor ./internal/execution \
            | tee "$RUNNER_TEMP/linux-baseline-tests.jsonl"

      - name: Run Linux integration targets
        id: integration
        run: |
          make --silent test-integration INTEGRATION_TEST_FLAGS=-json \
            | tee "$RUNNER_TEMP/linux-integration-tests.jsonl"
          make --silent test-integration-race INTEGRATION_TEST_FLAGS=-json \
            | tee "$RUNNER_TEMP/linux-proof-tests.jsonl"

      - name: Require Linux lifecycle fixtures to execute
        if: ${{ !cancelled() && (steps.integration.outcome == 'success' || steps.integration.outcome == 'failure') }}
        run: |
          python3 - "$RUNNER_TEMP/linux-proof-tests.jsonl" <<'PY'
          import json
          import sys

          required = {
              "TestSupervisorStreamsAndPrivateDescriptors",
              "TestSupervisorRetiresEscapedDescendants",
              "TestSupervisorCancelAndDeadline",
              "TestSupervisorCaptureAndPersistenceFailures",
              "TestOwnerSIGKILLRetainsLeasesThroughHelperClose",
              "TestSupervisorLossNeverCertifiesQuiescence",
              "TestBatchCancellationDuringHelperStartup",
              "TestStoredOwnerSIGKILLRetainsLeasesUntilHelperClose",
              "TestStoredHelperLossQuarantinesWithoutSignallingMetadata",
              "TestStoredFinalizationFailureQuarantinesLiveOwner",
              "TestStoredUnverifiedReapRetainsReservation",
              "TestLeaseExchangeLaunchAndPermanentFiles",
              "TestLeaseExchangeStoppedHelperRecoversOwner",
          }
          passed = set()
          with open(sys.argv[1], encoding="utf-8") as log:
              for line in log:
                  event = json.loads(line)
                  if event.get("Action") == "pass" and event.get("Package", "").endswith("/execution"):
                      passed.add(event.get("Test"))
          missing = sorted(required - passed)
          if missing:
              raise SystemExit("Linux proof fixtures missing, skipped or failed: " + repr(missing))
          print(f"Verified {len(required)} Linux proof fixtures executed and passed")
          PY

      - name: Vet Linux integration code
        run: go vet -tags fts5,integration ./internal/executor ./internal/execution

      - name: Preserve Linux comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-execution-proof-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/linux-proof-environment.txt
            ${{ runner.temp }}/linux-baseline-revision.txt
            ${{ runner.temp }}/linux-baseline-tests.jsonl
            ${{ runner.temp }}/linux-integration-tests.jsonl
            ${{ runner.temp }}/linux-proof-tests.jsonl
          retention-days: 14

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet -tags fts5 ./...

      # CLI integration tests include real process deadlines and encrypted
      # database setup; the full package can exceed Go's default ten minutes.
      # Run packages serially so competing encrypted-store tests do not starve
      # the capture tests' bounded writes. Race detection and concurrency within
      # each package remain enabled.
      - run: CGO_ENABLED=1 go test -tags fts5 -race -p 1 -timeout 20m ./...
        env:
          CAPY_DB_KEY: ci-test-key-at-least-32-characters-long!!
          CAPY_VAULT_KEY: ci-vault-key-at-least-32-characters-long!!

  # The vault TUI's glamour markdown renderer is behind `-tags glamour`; the
  # default build above never compiles it. Exercise the tagged path here so it
  # can't bit-rot, and assert the build tag actually toggles linkage.
  glamour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet -tags fts5,glamour ./internal/vault/tui/...

      - run: CGO_ENABLED=1 go test -tags fts5,glamour -race ./internal/vault/tui/...
        env:
          CAPY_DB_KEY: ci-test-key-at-least-32-characters-long!!
          CAPY_VAULT_KEY: ci-vault-key-at-least-32-characters-long!!

      - name: Assert build tag toggles glamour linkage
        run: |
          CGO_ENABLED=1 go build -tags fts5 -o capy-default ./cmd/capy/
          CGO_ENABLED=1 go build -tags fts5,glamour -o capy-glamour ./cmd/capy/
          if go tool nm capy-default | grep -qi glamour; then
            echo "::error::default build unexpectedly links glamour"; exit 1
          fi
          if ! go tool nm capy-glamour | grep -qi glamour; then
            echo "::error::glamour build does not link glamour"; exit 1
          fi
          echo "linkage OK: default excludes glamour, -tags glamour includes it"
