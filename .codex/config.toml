#:schema https://developers.openai.com/codex/config-schema.json
model = "gpt-6-astra"
model_reasoning_effort = "xhigh"
model_context_window = 1000000
model_auto_compact_token_limit = 1000000
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "read-only"

[features]
hooks = true

[agents]
max_threads = 6
max_depth = 1

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used", "used-tokens", "weekly-limit", "approval-mode", "session-id"]
terminal_title = ["project", "git-branch", "status", "thread", "task-progress"]
whimsy = false  # this is just bad... plus it creates weird flickering artifacts in tmux
animations = false  # even better, disable all animations to be sure no future "fancy feature" introduces weird behaviors in the terminal

[mcp_servers.capy]
command = "bash"
args = ["-c","set -uo pipefail\np=\"\"\nfor candidate in \"$(command -v capy 2\u003e/dev/null || true)\" \"$HOME/.local/bin/capy\" \"/opt/homebrew/bin/capy\" \"/usr/local/bin/capy\" \"$HOME/go/bin/capy\" \"capy\"; do\n  if [ -n \"$candidate\" ] \u0026\u0026 [ -f \"$candidate\" ] \u0026\u0026 [ -x \"$candidate\" ]; then\n    p=\"$candidate\"\n    break\n  fi\ndone\ncapy_run() {\n  \"$@\" \u003c\u00260 \u0026\n  capy_child=$!\n  trap 'kill -TERM \"$capy_child\" 2\u003e/dev/null; wait \"$capy_child\"; exit 143' TERM\n  trap 'kill -INT \"$capy_child\" 2\u003e/dev/null; wait \"$capy_child\"; exit 130' INT\n  trap 'kill -HUP \"$capy_child\" 2\u003e/dev/null; wait \"$capy_child\"; exit 129' HUP\n  wait \"$capy_child\"\n  capy_status=$?\n  trap - TERM INT HUP\n  return \"$capy_status\"\n}\nif [ -z \"$p\" ]; then\n  echo \"capy: launcher binary not found; install/upgrade capy from an external terminal, then rerun capy setup --platform codex\" \u003e\u00262\n  status=127\nelse\n  capy_run \"$p\" codex-launch \"$1\" \"$2\" \"$3\"\n  status=$?\nfi\nif [ \"$status\" -ne 0 ]; then\n  echo \"capy: Codex launch failed; repair the reported installation or install/upgrade capy, then rerun capy setup --platform codex from the intended project\" \u003e\u00262\n  if [ \"$2\" = \"hook\" ] \u0026\u0026 [ \"$3\" = \"pretooluse\" ]; then exit 2; fi\nfi\nexit \"$status\"\n","capy-codex-launch-v1","d54275171f475eb00dbb2e4f0bb33489","serve",""]
env_vars = ["CAPY_DB_KEY", "CAPY_VAULT_KEY"]
